name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match plugin.json version
        run: test "${GITHUB_REF_NAME#v}" = "$(python3 -c 'import json;print(json.load(open("asw/plugin.json"))["version"])')"
      - run: python3 tests/selfcheck.py
      - run: ./build.sh
      - uses: softprops/action-gh-release@v2.0.8
        with:
          files: dist/avnav-asw-*.zip
          body: |
            Install and warnings: see the [README](https://github.com/auto-sea-way/avnav-plugin#readme). Read the warnings before you use a route. Changes: see [CHANGELOG.md](https://github.com/auto-sea-way/avnav-plugin/blob/main/CHANGELOG.md).
